[package]
name = "modular-agent-jev"
version = "0.1.0"
description = "TypeSafe AI System One (Jev) modules for Modular Agent"
authors = ["Akira Ishino <akira@lumilab.jp>"]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/modular-agent/modular-agent-jev"

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

modular-agent-core = { path = "../../crates/modular-agent-core" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
